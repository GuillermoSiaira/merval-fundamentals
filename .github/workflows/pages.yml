name: Publicar reporte web (GitHub Pages)

on:
  schedule:
    # 08:00 ART (UTC-3) = 11:00 UTC · Lun, Mié, Vie
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch: {}          # botón "Run workflow" manual
  push:
    branches: [ main ]
    paths:
      - 'data/merval_panel.csv'
      - 'src/**'
      - 'run_analysis.py'
      - '.github/workflows/pages.yml'

# Permisos que necesita el deploy a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar reporte HTML
        run: |
          mkdir -p site
          python run_analysis.py --no-send --html site/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
