name: Deploy to GCP

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'gcp/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: merval-fundamentals
  FUNCTION_NAME: merval-analysis
  REGION: southamerica-east1

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests (pre-deploy)
        run: |
          pytest tests/ \
            -v --tb=short -m "not live"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --runtime=python311 \
            --trigger-http \
            --allow-unauthenticated \
            --source=. \
            --entry-point=merval_analysis \
            --memory=512MB \
            --timeout=300s \
            --set-env-vars="ALPHACAST_API_KEY=${{ secrets.ALPHACAST_API_KEY }}" \
            --set-env-vars="TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --set-env-vars="TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Get function URL
        run: |
          URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(httpsTrigger.url)")
          echo "✅ Cloud Function URL: $URL"
          echo "FUNCTION_URL=$URL" >> $GITHUB_ENV

      - name: Smoke test (invoke function)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.FUNCTION_URL }}")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Smoke test OK (HTTP 200)"
          else
            echo "❌ Smoke test falló (HTTP $STATUS)"
            exit 1
          fi
