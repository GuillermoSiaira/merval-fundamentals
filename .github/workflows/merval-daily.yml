name: Merval Daily Analysis

on:
  schedule:
    # GitHub Actions usa UTC. Argentina es UTC-3 (sin DST).
    # 08:00 ART = 11:00 UTC · Lunes, Miércoles, Viernes (1,3,5)
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch: {}   # permite "Run workflow" manual para probar

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHACAST_API_KEY:  ${{ secrets.ALPHACAST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_analysis.py --html merval_report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merval-report
          path: merval_report.html
          if-no-files-found: ignore
